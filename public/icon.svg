<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Receipt Paper -->
  <g transform="translate(116, 90)">
    <!-- Base Paper -->
    <path d="M 0 36 C 0 16 16 0 36 0 L 204 0 C 224 0 240 16 240 36 L 240 280 L 210 265 L 180 280 L 150 265 L 120 280 L 90 265 L 60 280 L 30 265 L 0 280 Z" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.25))"/>

    <!-- Receipt Header Line -->
    <rect x="36" y="44" width="70" height="12" rx="6" fill="#0f766e"/>
    <rect x="150" y="44" width="54" height="12" rx="6" fill="#0d9488"/>

    <!-- Transfer Lines -->
    <rect x="36" y="80" width="168" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="36" y="104" width="120" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="36" y="128" width="144" height="8" rx="4" fill="#e2e8f0"/>

    <!-- Amount Badge -->
    <rect x="36" y="160" width="168" height="42" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="120" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#15803d" text-anchor="middle">ETB 1,250</text>

    <!-- Scan Beam -->
    <rect x="0" y="110" width="240" height="6" fill="url(#scanGrad)" filter="url(#glow)"/>
  </g>

  <!-- Floating Tally Badge -->
  <g transform="translate(320, 310)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))">
    <circle cx="48" cy="48" r="48" fill="#14b8a6"/>
    <circle cx="48" cy="48" r="40" fill="#042f2e"/>
    <!-- Tally checkmark / sum symbol -->
    <path d="M32 48 L44 60 L66 36" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
